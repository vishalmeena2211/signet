packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
allowBuilds:
  # Postgres binaries must unpack; prisma generates its client; esbuild speeds vitest.
  '@embedded-postgres/darwin-arm64': true
  embedded-postgres: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Transitive natives we don't execute at build time:
  msgpackr-extract: false
  workerd: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
